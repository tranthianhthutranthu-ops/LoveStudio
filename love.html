<body class="love-page">

    <div class="stars"></div>

    <canvas id="fireworks"></canvas>

    <div class="love-content">

        <div class="envelope">💌</div>

        

        <div id="story">

    <h1 id="loveTitle"></h1>

    <p id="storyText"></p>

    <button id="yesButton">
        Đồng ý ❤️
    </button>

    <button id="thinkButton">
        Cho mình suy nghĩ 😊
    </button>

</div>

<button id="openLetter">
    Mở lời nhắn 💌
</button>  <div id="celebration">

    <div class="celebration-hearts">
        ❤️ 💕 ❤️ 💕 ❤️
    </div>

    <h1>
        Vậy là chúng ta chính thức rồi nhen❤️

        Cảm ơn bạn đã bước vào cuộc sống của mình.
    </p>

        +
        <span id="finalLoverName"></span> ❤️
    </div>  

</div>

    </div>

    <script src="script.js"></script>
<script>
async function shareLovePage() {

    const url = window.location.href;

    try {

        if (navigator.share) {

            await navigator.share({
                title: "Love Page ❤️",
                text: "Mình có một điều muốn gửi đến bạn ❤️",
                url: url
            });

        } else {

            await navigator.clipboard.writeText(url);

            alert("❤️ Đã copy link Love Page!");

        }

    } catch (error) {

        console.log(error);

        try {

            await navigator.clipboard.writeText(url);

            alert("❤️ Đã copy link Love Page!");

        } catch (e) {

            alert("Không thể chia sẻ. Hãy copy link trên thanh địa chỉ nhé ❤️");

        }
    }
}
</script>
</body>
